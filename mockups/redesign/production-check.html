  SAMPLE FIXTURE ONLY. Not part of the integration and never deployed.
  Loads the REAL production card from ../../custom_components/echo_experience/www/echo-experience.js,
  so serve the repository root (e.g. port 8766), then open
  /mockups/redesign/production-check.html?view=music&style=wash&sample=photo
  Query:
    view    home | music | weather | guide | controls | timers | answer   (default music)
    style   wash | colour | bleed                                        (default wash)
    sample  photo | busy | radio | radio-unknown | none | broken | idle  (default photo)
    guide   answer      HomeGuide shows a sample question/answer instead of the library grid
    answer  conversion | short | long | long-question | empty | zero | negative | large | long-unit   (view=answer; default conversion)
    timers  empty | single | paused | hours | multi | many | ringing | ringing-multi | 1
            (1 = the original two sample timers, one paused; ringing = one finished alarm; ringing-multi = a finished
             alarm plus two timers; many = six timers)
    links   1           shows a panel of preview links for the answer, conversion and timer states
    ambient 1           screensaver mode (no navigation, not interactive)
    paused  1           music sample paused instead of playing
    label   0           hides the "Sample fixture" tag for clean screenshots
    freeze  1           fixes the clock at Mon 5 Oct 18:45 local time and stops every countdown (Date is frozen)
    card    baseline    loads baseline/echo-experience-0.8.0.js, a byte-for-byte snapshot of the card installed on
                        Home Assistant (0.8.0), instead of the working copy. Preview only; used by home-compare.html.
  home-compare.html flicks between the installed 0.8.0 and proposed 0.8.1 Home in isolated iframes.
  window.echoFixture exposes { card, calls, states, setSample, setStyle, go, setState }.
  Mock hass: callWS/callService are recorded in echoFixture.calls and only change these local sample states.
-->

    appliance_id: 'microwave', question: 'Sample question: how do I use defrost?',
    guide: { answer: 'Sample answer text for layout checking only. This fixture does not contain real appliance guidance.', results: [
      { document: 'Sample manual', page: 12, text: 'Sample excerpt text for layout checking.' },
      { document: 'Sample manual', page: 18, text: 'A second sample excerpt <b>with markup that must stay escaped</b>.' }] } } : {} };
  if (VIEW === 'answer') return { view: 'answer', timestamp: ts(), payload: ANSWERS[pick(q.get('answer'), Object.keys(ANSWERS), 'conversion')] };
  if (VIEW === 'weather') return { view: 'weather', timestamp: ts(), payload: { period: 'today' } };
  return { view: VIEW, timestamp: ts(), payload: {} };
}
// Same shape as core.convert() output and the voice answer payload ({question, speech}). Sample text only.
const conv = (value, from_unit, to_unit, result) => ({ value, from_unit, to_unit, result, equation: `${value} ${from_unit} = ${result} ${to_unit}` });
const ANSWERS = {
  conversion: conv(250, 'g', 'oz', 8.8185),
  zero: conv(0, 'g', 'oz', 0),
  negative: conv(-40, '°C', '°F', -40),
  large: conv(1000000000000000, 'mm', 'km', 1000000000000),
  'long-unit': conv(250, 'mL', 'us fl oz', 8.4535),
  short: { question: 'Sample question: what time is sunset?', speech: 'Sample short answer: 6:41 pm.' },
  long: { question: 'Sample question with a longer wording, used to check how the muted question line wraps above the answer?',
    speech: 'Sample long answer for layout checking only. It is deliberately long so that it needs to scroll inside its own region.\n\nA second paragraph keeps its line break. Markup such as <b>this</b> must stay escaped as text.\n\n' + Array.from({ length: 8 }, (_, i) => `Sample line ${i + 1}: filler text that wraps across the reading width to fill the answer area.`).join('\n') },
  'long-question': { question: 'Sample question: could you explain the difference between these options and tell me which one would work best for my kitchen? '.repeat(7).trim(),
    speech: 'Sample answer under a very long question. The question scrolls in its own capped area so this answer keeps room.' },
  empty: {},
};
const T = (id, name, secs, active = true) => ({ id: 'sample-' + id, name: name + ' (sample)', is_active: active, seconds_left: secs, total_seconds: secs, sampled_at: ts() });
const TIMERS = {
  empty: [], single: [T('pasta', 'Pasta', 540)], paused: [T('eggs', 'Eggs', 125, false)],
  multi: [T('pasta', 'Pasta', 540), T('eggs', 'Eggs', 125, false), T('rice', 'Rice', 1085)],
  many: [T('pasta', 'Pasta', 540), T('eggs', 'Eggs', 125, false), T('rice', 'Rice', 1085), T('bread', 'Bread', 3725), T('tea', 'Tea', 180), T('oven', 'An oven timer with a long sample name', 2400, false)],
  hours: [T('slow', 'Slow cook', 86400)],
  ringing: [], 'ringing-multi': [T('pasta', 'Pasta', 540), T('eggs', 'Eggs', 125, false)],
  1: [T('pasta', 'Pasta', 540), T('eggs', 'Eggs', 125, false)],
};
const TIMER_SET = pick(q.get('timers'), Object.keys(TIMERS), 'empty');
const timers = TIMERS[TIMER_SET];
// Finished alarms as the server records them; this page never hosts Voice Satellite, so nothing is dismissed or reported.
const ringing = TIMER_SET.startsWith('ringing') ? [{ id: 'sample-roast', name: 'Roast (sample)', total_seconds: 3600, finished_at: ts() - 20 }] : [];
if (q.get('links') === '1') {
  const box = document.getElementById('fixture-links'); box.hidden = false;
  const add = (label, qs) => { const a = document.createElement('a'); a.href = '?' + qs; a.textContent = label; box.append(a); };
  const cmp = document.createElement('a'); cmp.href = 'home-compare.html'; cmp.textContent = 'Home: installed 0.8.0 vs proposed 0.8.1'; cmp.style.fontWeight = '600'; box.append(cmp);
  for (const k of Object.keys(ANSWERS)) add('answer: ' + k, 'view=answer&answer=' + k + '&links=1');
  for (const k of Object.keys(TIMERS)) add('timers: ' + k, 'view=timers&timers=' + k + '&links=1');
  add('home + timer strip', 'view=home&timers=multi&links=1');
}

/* ---------- Mock hass: records calls, mutates only these local sample states ---------- */
const calls = [];
let card;
function publish() { card.hass = { ...hass, states: { ...states } }; }
function setState(id, patch) { states[id] = { ...states[id], ...patch, attributes: { ...states[id]?.attributes, ...(patch.attributes || {}) } }; publish(); }
const hass = {
  states,
  connection: { subscribeMessage: async () => () => {} },
  async callWS(msg) {
    calls.push(['ws', msg]);
    if (msg.type === 'echo_experience/state') {
      const snap = { profile, timers, ringing, music_player: PLAYER, result: initialResult() };
      if (msg.forecast) snap.forecast = forecast();
      return snap;
    }
    if (msg.type === 'echo_experience/action' && msg.action === 'music') {
      const a = msg.args || {}, s = states[PLAYER];
      if (a.action === 'pause' || a.action === 'stop') setState(PLAYER, { state: a.action === 'stop' ? 'idle' : 'paused' });
      if (a.action === 'resume') setState(PLAYER, { state: 'playing', attributes: { media_position_updated_at: nowIso() } });
      if (a.action === 'shuffle') setState(PLAYER, { attributes: { shuffle: !!a.shuffle } });
      if (a.action === 'volume') setState(PLAYER, { attributes: { volume_level: a.volume / 100 } });
      if ((a.action === 'next' || a.action === 'previous') && s.attributes.media_duration) setState(PLAYER, { attributes: { media_position: 0, media_position_updated_at: nowIso() } });
      return { status: 'request_accepted', player: PLAYER, state: states[PLAYER].state };
    }
    if (msg.type === 'echo_experience/action' && msg.action === 'timer') {
      // Local sample timers only: mirrors the payloads the card sends, never a real timer.
      const a = msg.args || {}, i = timers.findIndex(t => t.id === a.timer_id), t = timers[i], now = ts();
      if (t) t.seconds_left = card.remaining(t), t.sampled_at = now;
      if (a.operation === 'pause' && t) t.is_active = false;
      if (a.operation === 'resume' && t) t.is_active = true;
      if (a.operation === 'add' && t) t.seconds_left += 60;
      if (a.operation === 'cancel' && t) timers.splice(i, 1);
      if (a.operation === 'start') timers.push({ id: 'sample-' + now, name: a.name, is_active: true, seconds_left: a.seconds, total_seconds: a.seconds, sampled_at: now });
      return { status: 'request_accepted', timers: [...timers] };
    }
    return { status: 'request_accepted' };
  },
  async callService(domain, service, data) {
    calls.push(['service', domain, service, data]);
    const id = data?.entity_id;
    if (domain === 'light') setState(id, { state: service === 'turn_on' ? 'on' : 'off' });
    if (domain === 'climate' && service === 'set_temperature') setState(id, { attributes: { temperature: data.temperature } });
    if (domain === 'switch') setState(id, { state: service === 'turn_on' ? 'on' : 'off' });
  },
};

/* ---------- Mount the real production card ---------- */
const script = document.createElement('script');
script.src = CARD_SRC;
script.onload = () => {
  card = document.createElement('echo-experience-card');
  card.setConfig({ type: 'custom:echo-experience-card', device: 'echo_show_8', ambient: AMBIENT });
  card.hass = hass;
  document.body.append(card);
  window.addEventListener('hass-more-info', e => calls.push(['more-info', e.detail]));
  window.echoFixture = {
    card, calls, states, setState,
    setSample(name, playing = true) { states[PLAYER] = { ...playerState(name, playing), entity_id: PLAYER }; publish(); },
    setStyle(style) { profile.music_style = style; if (card.data) card.data.profile.music_style = style; card.render(); },
    go(view) { card.go(view); },
  };
};
script.onerror = () => { document.body.append('Could not load the production card. Serve the repository root, not mockups/.'); };
document.head.append(script);
</script>
</body>
</html>
