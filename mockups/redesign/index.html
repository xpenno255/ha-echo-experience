  <header class="preview-bar" aria-label="Mockup controls">
    <p class="demo-label"><strong>Mockup</strong> <span>Sample data only. Nothing here talks to Home Assistant or plays sound.</span></p>
    <div class="preview-switches">
      <fieldset class="seg" id="concept-switch">
        <legend>Music style</legend>
        <label><input type="radio" name="concept" value="wash"><span>Artwork wash</span></label>
        <label><input type="radio" name="concept" value="colour"><span>Colour atmosphere</span></label>
        <label><input type="radio" name="concept" value="bleed"><span>Full-bleed</span></label>
      </fieldset>
      <label class="sample-pick">
        <span>Music sample</span>
        <select id="sample-switch">
          <option value="photo">Photo artwork</option>
          <option value="busy">Busy illustration</option>
          <option value="radio">Live radio logo</option>
          <option value="none">No artwork, long names</option>
        </select>
      </label>
    </div>
  </header>

  <main class="viewport" id="viewport">
    <div class="stage-frame" id="stage-frame">
      <div class="stage" id="stage" data-view="home">
        <div class="backdrop" id="backdrop" aria-hidden="true"></div>
        <header class="screen-head" id="screen-head"></header>
        <div class="screen-body" id="screen-body"></div>
        <nav class="screen-nav" aria-label="Echo views">
          <ul class="nav-list" id="nav-list"></ul>
        </nav>
      </div>
    </div>
  </main>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>

  <script src="app.js"></script>
</body>
</html>
